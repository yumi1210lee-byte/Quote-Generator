<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>報價單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@600;700&family=Montserrat:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-group edit-only">
      <label>範本
        <select id="templateSelect"></select>
      </label>
      <label>已存報價單
        <select id="savedSelect"></select>
      </label>
      <button id="saveBtn" type="button">儲存</button>
      <button id="deleteBtn" type="button" class="ghost">刪除</button>
      <button id="saveTplBtn" type="button" class="ghost">另存為範本</button>
      <button id="libraryBtn" type="button" class="ghost">品項庫</button>
      <button id="receiptBtn" type="button" class="ghost quote-only" title="用目前這份報價單的客戶與品項開一張收據">產生收據</button>
      <button id="backQuoteBtn" type="button" class="ghost receipt-only">回到報價單</button>
    </div>
    <div class="toolbar-group">
      <button id="shareBtn" type="button" class="edit-only">複製分享連結</button>
      <button id="exportBtn" type="button" class="ghost edit-only">匯出檔案</button>
      <label class="ghost button edit-only">匯入檔案<input id="importInput" type="file" accept="application/json" hidden></label>
      <button id="editCopyBtn" type="button" class="ghost view-only">編輯副本</button>
      <button id="printBtn" type="button" class="primary">列印 / 存成 PDF</button>
    </div>
  </header>

  <main class="layout">
    <form id="editor" class="editor edit-only" autocomplete="off" onsubmit="return false">
      <section>
        <h2>專案資訊</h2>
        <div class="grid2">
          <label class="span2">專案名稱<input data-field="project"></label>
          <label><span class="quote-only">報價日期</span><span class="receipt-only">收據日期</span><input type="date" data-field="date"></label>
          <label class="quote-only">有效天數<input type="number" min="1" data-field="validDays"></label>
          <label class="receipt-only">收據編號<input data-field="receiptNo" placeholder="例：2026001"></label>
          <label>客戶<input data-field="client"></label>
          <label>聯絡人<input data-field="contact"></label>
          <label class="span2 receipt-only">客戶地址<textarea rows="2" data-field="clientAddress"></textarea></label>
          <label class="span2">聯絡方式<input data-field="contactInfo"></label>
        </div>
      </section>

      <section class="receipt-only">
        <h2>收據 / 發票設定</h2>
        <div class="grid2">
          <label class="span2">標題
            <select data-field="docTitle">
              <option value="receipt">收據 RECEIPT</option>
              <option value="invoice">發票 INVOICE</option>
            </select>
          </label>
          <label>款項
            <select data-field="payStage">
              <option value="full">全額 Full payment</option>
              <option value="deposit">訂金 Deposit</option>
              <option value="balance">尾款 Balance</option>
            </select>
          </label>
          <label>付款方式
            <select data-field="payMethod">
              <option value="bank">銀行轉帳</option>
              <option value="paypal">PayPal</option>
              <option value="both">銀行轉帳＋PayPal</option>
            </select>
          </label>
          <label class="span2">實收金額<input data-field="received" placeholder="留空＝依款項自動計算"></label>
        </div>
        <p class="hint">品項的「英文名稱」會印在中文下面；代墊費用可以另開一個分類，例如「代墊費用 Expense Reimbursement」，並勾選不打折。</p>
      </section>

      <section>
        <h2><span class="quote-only">報價項目</span><span class="receipt-only">收款項目</span></h2>
        <div id="groups"></div>
        <button type="button" id="addGroupBtn" class="ghost">＋ 新增項目分類</button>
      </section>

      <section>
        <h2>小計與折扣</h2>
        <div class="grid2">
          <label class="span2">小計標題<input data-field="subtotalLabel" placeholder="小計"></label>
          <label class="span2">折扣說明<textarea rows="2" data-field="discountLabel" placeholder="例：首次合作/朋友推薦 折扣"></textarea></label>
          <label>折數<input data-field="discountRate" placeholder="例：79、85、9（空白＝不打折）"></label>
          <label>訂金比例 (%)<input type="number" min="0" max="100" data-field="depositPct"></label>
        </div>
      </section>

      <section>
        <h2>備註</h2>
        <textarea rows="6" data-field="notes"></textarea>
      </section>

      <section class="quote-only">
        <h2>時程安排</h2>
        <p class="hint">日期可留空；結束日期只在期間時填寫。整段都空白就不會顯示。</p>
        <div id="schedule"></div>
        <button type="button" id="addStepBtn" class="ghost">＋ 新增時程</button>
      </section>

      <details>
        <summary>我的資料與合作條款（會記在這台瀏覽器）</summary>
        <div class="grid2">
          <label>工作室 / 品牌名稱（大標題）<input data-profile="studioName" placeholder="留空就用設計師名字"></label>
          <label>設計師<input data-profile="designer"></label>
          <label>電話<input data-profile="phone"></label>
          <label class="span2">Email<input data-profile="email"></label>
          <label>銀行代碼 / 分行<input data-profile="bankCode"></label>
          <label>帳號<input data-profile="bankAccount"></label>
          <label class="span2">合作條款 <small>（{訂金} 會自動換成訂金比例）</small><textarea rows="6" data-profile="terms"></textarea></label>
          <label class="span2">頁尾<input data-profile="footer"></label>
          <p class="span2 hint sub-head">收據用（中英文，國外客戶匯款需要）</p>
          <label>英文姓名<input data-profile="designerEn" placeholder="例：LEE, WAN-YU"></label>
          <label>戶名（留空用英文姓名）<input data-profile="beneficiary"></label>
          <label class="span2">地址<input data-profile="address"></label>
          <label class="span2">英文地址<textarea rows="2" data-profile="addressEn"></textarea></label>
          <label>銀行英文名稱<input data-profile="bankNameEn" placeholder="例：First Commercial Bank"></label>
          <label>SWIFT Code<input data-profile="swift"></label>
          <label class="span2">PayPal 帳號（email 或 paypal.me 連結）<input data-profile="paypal"></label>
          <label>分行（英文）<input data-profile="bankBranch"></label>
          <label class="span2">銀行地址（英文）<textarea rows="2" data-profile="bankAddress"></textarea></label>
        </div>
      </details>
    </form>

    <div class="preview-wrap">
      <article id="paper" class="paper"></article>
    </div>
  </main>

  <dialog id="libDialog" class="lib-dialog">
    <div class="lib-head">
      <h2 id="libTitle">品項庫與範本</h2>
      <button type="button" class="icon" data-lib="close" title="關閉">✕</button>
    </div>
    <div class="lib-tabs">
      <button type="button" class="chip" data-lib="tab" data-tab="items">品項庫</button>
      <button type="button" class="chip" data-lib="tab" data-tab="templates">我的範本</button>
    </div>
    <div class="lib-tools">
      <input id="libSearch" type="search" placeholder="搜尋品項，例如：logo、海報、修改">
      <button type="button" data-lib="new">＋ 新增品項</button>
    </div>
    <div id="libCatsBar" class="lib-cats"></div>
    <div id="libList" class="lib-list"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="presets.js"></script>
  <script src="market.js"></script>
  <script src="app.js"></script>
</body>
</html>
